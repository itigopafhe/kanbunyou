<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしの高機能 漢文アプリ</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header"><h1>わたしの高機能 漢文アプリ</h1></header>
    <nav class="tab-nav">
        <button class="tab-btn active" data-tab="kuhou-list">句法一覧</button>
        <button class="tab-btn" data-tab="training">句法トレーニング</button>
        <button class="tab-btn" data-tab="goku-list">語句帳</button>
    </nav>
    <main>
        <div id="kuhou-list-view" class="view active">
            <div class="main-controls"><input type="search" id="kuhou-search-box" class="search-box" placeholder="グループ、句法、例文、解説などで検索..."><button id="add-group-btn" class="btn">＋ 新規グループを追加</button></div>
            <details class="sub-controls"><summary>句法データ管理・ツール</summary><div class="btn-group"><button class="btn kuhou-action" data-action="import">インポート</button><button class="btn kuhou-action" data-action="export-excel">Excel出力</button><button class="btn kuhou-action" data-action="download-template">雛形DL</button><button class="btn kuhou-action" data-action="load-preset" style="background-color:#28a745">テンプレート</button><button class="btn kuhou-action" data-action="manage-tags" style="background-color:#6c5ce7">タグ管理</button><button class="btn kuhou-action" data-action="toggle-shuffle" id="kuhou-shuffle-btn" style="background-color:#7a7060">🔀 シャッフル</button></div></details>
            <div id="kuhou-tag-filter-container"></div>
            <div class="status-bar"><span>★ </span><span id="kuhou-count-display"></span></div>
            <div class="reveal-toggle-bar" id="kuhou-reveal-bar"><span class="rt-label">一括表示</span><button class="reveal-chip" data-reveal="reading">読み</button><button class="reveal-chip" data-reveal="meaning">訳</button><button class="reveal-chip" data-reveal="kakikudashi">書き下し</button><button class="reveal-chip" data-reveal="translation">日本語訳</button></div>
            <div id="kuhou-container"></div>
        </div>
        <div id="training-view" class="view"><div id="training-container"></div></div>
        <div id="goku-list-view" class="view">
             <div class="main-controls"><input type="search" id="goku-search-box" class="search-box" placeholder="語句、読み、意味、例文などで検索..."><button id="add-goku-btn" class="btn">＋ 新規語句を追加</button></div>
             <details class="sub-controls"><summary>語句データ管理・ツール</summary><div class="btn-group"><button class="btn goku-action" data-action="import">インポート</button><button class="btn goku-action" data-action="export-excel">Excel出力</button><button class="btn goku-action" data-action="download-template">雛形DL</button><button class="btn goku-action" data-action="share" style="background-color: #17a2b8;">共有リンク</button></div></details>
            <div id="goku-tag-filter-container"></div>
            <div class="status-bar"><span>★ </span><span id="goku-count-display"></span></div>
            <div id="goku-container" class="item-container" style="display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>
        </div>
    </main>
    <div id="modal-overlay" class="hidden"></div>
    <div id="modal-container" class="hidden"></div>
    <input type="file" id="import-file-input" class="hidden" accept=".xlsx, .csv">
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/kuhou.js"></script>
    <script src="js/goku.js"></script>
    <script src="js/import-export.js"></script>
    <script src="js/training.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
