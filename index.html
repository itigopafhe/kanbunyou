<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしの高機能 漢文アプリ</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <style>
        :root{--primary-color:#593c1b;--secondary-color:#0067C0;--danger-color:#c0392b;--bg-color:#f5f2ea;--card-bg-color:#fff;--text-color:#2a2a2a;--base-padding:8px;--muted:#8a8070;--line:#e6e0d4;--soft:#faf7f0}
        *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;background-color:var(--bg-color);color:var(--text-color);margin:0;padding:var(--base-padding);font-size:14px;line-height:1.5}
        .header h1{color:var(--primary-color);margin:0;font-size:16px;text-align:center;padding:2px 0 8px;letter-spacing:.05em}
        .tab-nav{display:flex;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
        .tab-btn{padding:8px 12px;border:none;background-color:transparent;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:36px;flex:1}
        .tab-btn.active{color:var(--secondary-color);border-bottom-color:var(--secondary-color);font-weight:700}
        .view{display:none}.view.active{display:block}
        
        .main-controls{margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
        .sub-controls { margin-bottom:8px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
        .sub-controls > summary { list-style:none; padding: 8px 10px; font-size: 12px; color: var(--muted); font-weight:700; letter-spacing:.06em; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
        .sub-controls > summary::-webkit-details-marker { display:none; }
        .sub-controls > summary::after { content:'▾'; color:var(--muted); }
        .sub-controls[open] > summary::after { content:'▴'; }
        .sub-controls .btn-group { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; }
        .sub-controls .btn { font-size: 12px; padding: 6px 10px; background-color: #7a7060; min-height:30px; font-weight:600; border-radius:6px; }

        .btn{padding:8px 12px;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:background-color .2s;min-height:38px}
        .btn:hover{opacity:.9}
        #add-group-btn, #add-goku-btn { background-color: var(--secondary-color); flex-grow: 1; }
        .search-box{flex-grow:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
        .status-bar{text-align:left;margin:6px 0 6px;font-size:12px;color:var(--muted)}
        
        .kuhou-group { background-color: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
        .kuhou-group-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 4px; background: var(--soft);}
        .kuhou-group-title { font-size: 13px; font-weight: 700; color: var(--primary-color); letter-spacing: .04em; }
        .subgroup-container { padding: 4px 6px 6px; }
        .subgroup { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; background: #fff; overflow: hidden; }
        .subgroup > details > summary { list-style: none; }
        .subgroup > details > summary::-webkit-details-marker { display: none; }
        .subgroup > details[open] > summary { border-bottom: 1px solid var(--line); }
        .subgroup-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background-color: #fff; gap: 6px; cursor: pointer; }
        .subgroup-header .actions { flex-shrink: 0; }
        .subgroup > details:not([open]) > summary::before { content: '▸'; color: var(--muted); font-size: 11px; margin-right: 2px; }
        .subgroup > details[open] > summary::before { content: '▾'; color: var(--muted); font-size: 11px; margin-right: 2px; }
        .subgroup-title { font-size: 16px; font-weight: 700; color: var(--secondary-color); letter-spacing: 0.02em; }
        .subgroup-summary-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
        .summary-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .summary-field { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-color); flex: 1 1 100%; }
        .summary-field .label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; min-width: 22px; }
        .summary-field .value { flex: 1; padding: 3px 8px; border-radius: 5px; background: var(--soft); min-height: 20px; cursor: pointer; transition: background .15s; user-select: none; color: var(--text-color); font-size: 13px; }
        .summary-field .value.hidden-blur { color: transparent; background: #d9d2bf; }
        .summary-field .value:active { background: #e8e2d2; }
        
        .item-card-container { padding: 4px 6px 6px; background: #fbfaf5; }
        .item-card{background-color:transparent;padding:0;display:flex;flex-direction:column;position:relative}
        .item-card h3 { margin:0 0 8px 0; font-size: 18px; }

        .kuhou-example { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px 6px; margin-bottom: 4px; }
        .kuhou-example-label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 3px; font-weight: 700; }
        .ex-line { display: flex; align-items: baseline; gap: 5px; padding: 1px 0; }
        .ex-line:last-child { border-bottom: none; }
        .ex-line .ex-label { font-size: 10px; color: var(--muted); min-width: 42px; letter-spacing: 0.04em; }
        .ex-line .ex-value { flex: 1; line-height: 1.5; padding: 2px 6px; border-radius: 4px; background: var(--soft); cursor: pointer; user-select: none; transition: background .15s; min-height: 18px; color: var(--text-color); font-size: 13px; }
        .ex-line .ex-value.hidden-blur { color: transparent; background: #d9d2bf; }
        .ex-line .ex-value:empty::before { content: '—'; color: #bbb; }
        .reveal-toggle-bar { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; padding: 5px 8px; background: #fff; border: 1px solid var(--line); border-radius: 8px; align-items: center; }
        .reveal-toggle-bar .rt-label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; margin-right: 2px; }
        .reveal-chip { padding: 3px 8px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; min-height: 24px; }
        .reveal-chip.active { background: var(--secondary-color); color: #fff; border-color: var(--secondary-color); }
        #kuhou-container.reveal-reading .summary-value[data-field="reading"].hidden-blur,
        #kuhou-container.reveal-meaning .summary-value[data-field="meaning"].hidden-blur { color: var(--text-color); background: #f5f2ea; }
        #kuhou-container.reveal-kakikudashi .ex-value[data-field="kakikudashi"].hidden-blur,
        #kuhou-container.reveal-translation .ex-value[data-field="translation"].hidden-blur { color: var(--text-color); background: #f7f4ec; }
        .subgroup.sg-reveal-all .summary-value.hidden-blur { color: var(--text-color); background: #f5f2ea; }
        .subgroup.sg-reveal-all .ex-value.hidden-blur { color: var(--text-color); background: #f7f4ec; }
        .actions .toggle-all-btn { color: var(--secondary-color); border-color: var(--secondary-color); }
        .subgroup.sg-reveal-all .actions .toggle-all-btn { background: var(--secondary-color); color: #fff; }
        .training-card { background: #fff; border-radius: 14px; border: 1px solid var(--line); padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        .training-card h2 { margin: 0 0 14px; color: var(--primary-color); font-size: 18px; }
        .tr-section { margin-bottom: 14px; }
        .tr-section .tr-label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; margin-bottom: 8px; }
        .tr-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .tr-chip { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; min-height: 36px; }
        .tr-chip.active { background: var(--secondary-color); color: #fff; border-color: var(--secondary-color); }
        .tr-count-input { width: 80px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
        .tr-start-btn { width: 100%; padding: 14px; font-size: 16px; background: var(--secondary-color); }
        .tr-progress { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
        .tr-progress > div { height: 100%; background: var(--secondary-color); transition: width .2s; }
        .tr-question-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
        .tr-question { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
        .tr-question-body { font-size: 22px; padding: 16px; background: #faf7ef; border-radius: 10px; margin-bottom: 16px; line-height: 1.5; word-break: break-word; }
        .tr-choices { display: flex; flex-direction: column; gap: 10px; }
        .tr-choice { text-align: left; padding: 14px 16px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--text-color); cursor: pointer; min-height: 48px; line-height: 1.5; }
        .tr-choice:active { background: #f5f2ea; }
        .tr-choice.correct { background: #e5f5e5; border-color: #4caf50; color: #2e7d32; font-weight: 700; }
        .tr-choice.wrong { background: #fbe6e4; border-color: var(--danger-color); color: var(--danger-color); font-weight: 700; }
        .tr-choice:disabled { cursor: default; }
        .tr-explanation { margin-top: 14px; padding: 12px; background: #f7f4ec; border-radius: 8px; font-size: 14px; line-height: 1.6; }
        .tr-explanation strong { color: var(--primary-color); display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: .06em; }
        .tr-next-btn { margin-top: 14px; width: 100%; padding: 14px; background: var(--secondary-color); font-size: 15px; }
        .tr-result-score { font-size: 42px; font-weight: 700; text-align: center; color: var(--secondary-color); margin: 20px 0 8px; }
        .tr-result-label { text-align: center; color: var(--muted); margin-bottom: 20px; }
        .tr-result-actions { display: flex; gap: 10px; }
        .tr-result-actions .btn { flex: 1; }
        .tr-empty { text-align: center; color: var(--muted); padding: 30px 10px; }
        .check-btn { border: none; background: transparent; cursor: pointer; padding: 2px; font-size: 16px; line-height: 1; color: #c9c2b0; user-select: none; }
        .check-btn.checked { color: #f5b301; }
        .check-btn:active { transform: scale(0.9); }
        .summary-row .check-btn { margin-right: 0; padding: 2px; font-size: 16px; }
        .kuhou-example { position: relative; }
        .kuhou-example .check-btn { position: absolute; top: 2px; right: 4px; padding: 2px 4px; font-size: 14px; }
        .kuhou-example-label { padding-right: 26px; }
        .tr-check-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tr-check-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; font-size: 13px; color: var(--muted); cursor: pointer; min-height: 32px; }
        .tr-check-toggle.checked { color: #b78200; border-color: #f5b301; background: #fffbea; font-weight: 700; }
        .goku-link { color: var(--secondary-color); border-bottom: 1px dashed var(--secondary-color); cursor: pointer; padding: 0 1px; }
        .goku-link:active { background: #e3f0fb; }
        .ex-value.hidden-blur .goku-link, .summary-value.hidden-blur .goku-link { color: transparent !important; border-bottom-color: transparent !important; background: transparent !important; }
        mark { background: #fff176; color: inherit; padding: 0 2px; border-radius: 3px; font-weight: 700; }
        .hidden-blur mark { background: transparent !important; color: transparent !important; }

        .field{border-left:3px solid var(--line);padding-left:12px;margin-bottom:12px}.field-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.field-title{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}.field .content{line-height:1.6;white-space:pre-wrap;}
        
        .actions{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
        .actions button { background: #fff; border: 1px solid var(--line); color:var(--muted); border-radius:5px; font-size: 11px; cursor: pointer; padding: 3px 7px; font-weight:600; min-height: 26px;}
        .actions button:active { background-color: #f0ece0; }
        .actions .reorder-btn { font-size: 13px; padding: 2px 7px; }
        .ex-source { font-size: 10px; color: var(--muted); margin-top: 2px; text-align: right; }
        .card-actions{margin-top:auto;padding-top:15px;text-align:right;border-top:1px solid #f0f0f0;display:flex;gap:8px;justify-content:flex-end;}.card-actions button{background:0 0;border:1px solid #ccc;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12px;}.card-actions button:hover{background-color:#eee}
        .delete-btn{border-color:var(--danger-color);color:var(--danger-color)}.delete-btn:hover{background-color:var(--danger-color);color:#fff}
        
        .hidden { display: none !important; }
        button:disabled { opacity: 0.5; cursor: not-allowed; background-color: #ccc !important; }
        @media (max-width: 600px) {
          body { padding: 6px; }
          .modal-content input[type=text], .modal-content textarea { font-size: 16px; }
        }

        .card-tags { padding-top: 4px; }
        .card-tag { display: inline-block; background-color: #eee0c8; color: #6a5030; padding: 1px 7px; font-size: 10px; border-radius: 8px; margin-right: 3px; margin-bottom: 2px; }
        
        .details-section { margin-top: 4px; }
        .details-section summary { cursor: pointer; font-weight: 600; color: var(--secondary-color); padding: 4px 6px; font-size: 12px; background: var(--soft); border-radius: 4px; }
        .details-section[open] summary { border-radius: 4px 4px 0 0; }
        .details-section .details-content { padding: 6px 6px 2px; background: #fff; border: 1px solid var(--line); border-top: none; border-radius: 0 0 4px 4px; }
        .details-section .details-content p { margin: 0 0 6px; line-height: 1.5; font-size: 12px; }
        .details-section .details-content p strong { display: block; margin-bottom: 2px; font-size: 10px; color: var(--muted); letter-spacing: .06em; }
        .details-photo { max-width: 100%; border-radius: 6px; margin-top: 4px; }

        .goku-entry { border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 15px; }
        .goku-entry:first-child { border-top: none; padding-top: 0; margin-top: 0; }
        .goku-entry-header { font-weight: bold; font-size: 1.1em; }
        .goku-entry-pos { font-size: 0.9em; color: #666; margin-left: 8px; }
        .goku-entry-meanings { list-style-type: decimal; padding-left: 20px; }

        #modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,.6);z-index:1000}
        #modal-container{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background-color:var(--bg-color);padding:25px;border-radius:12px;box-shadow:0 5px 25px rgba(0,0,0,.2);z-index:1001;width:90%;max-width:600px;max-height:85vh;display:flex;flex-direction:column}
        #modal-container h2{margin-top:0;color:var(--primary-color)}
        .modal-content{overflow-y:auto;flex-grow:1}
        .modal-content form{display:flex;flex-direction:column;gap:15px}
        .modal-content label{font-weight:700;font-size:14px;color:var(--primary-color);margin-bottom:-10px}
        .modal-content fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 10px 15px; margin-top: 10px; }
        .modal-content legend { font-weight: bold; padding: 0 5px; }
        .modal-content input[type=text],.modal-content textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
        .modal-content textarea{min-height:80px;resize:vertical}
        #photo-preview { max-width: 150px; max-height: 150px; margin-top: 10px; border: 1px solid #ccc; background: #fff; padding: 5px; border-radius: 4px; }
        
        .modal-actions{display:flex;align-items:center;gap:10px;margin-top:25px;flex-shrink:0}
        .modal-actions .left-action { margin-right: auto; }
        .modal-actions .btn { color: #fff !important; }
        .modal-actions .btn-save{ background-color: var(--secondary-color); }
        .modal-actions .btn-cancel{ background-color: #888; }
        .modal-actions .btn-sub-action { background-color: #6c757d; }
    
        :root { --tag-filter-text-color: #0067C0; --tag-filter-bg-color: #ffffff; --tag-filter-border-color: #0067C0; --tag-filter-active-text-color: #ffffff; --tag-filter-active-bg-color: #0067C0; }
        .tag-filter-system-container { width: 100%; text-align: left; padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 6px;}
        .tag-filter-btn { background-color: var(--tag-filter-bg-color); color: var(--tag-filter-text-color); border: 1px solid var(--tag-filter-border-color); border-radius: 12px; padding: 3px 10px; margin: 2px; cursor: pointer; transition: all 0.15s ease; font-size: 11px; font-weight: 600; min-height: 22px; }
        .tag-filter-btn:hover { opacity: 0.8; }
        .tag-filter-btn.active { background-color: var(--tag-filter-active-bg-color); color: var(--tag-filter-active-text-color); border-color: var(--tag-filter-active-bg-color); }
    </style>
</head>
<body>
    <header class="header"><h1>わたしの高機能 漢文アプリ</h1></header>
    <nav class="tab-nav">
        <button class="tab-btn active" data-tab="kuhou-list">句法一覧</button>
        <button class="tab-btn" data-tab="training">句法トレーニング</button>
        <button class="tab-btn" data-tab="goku-list">語句帳</button>
    </nav>
    <main>
        <div id="kuhou-list-view" class="view active">
            <div class="main-controls"><input type="search" id="kuhou-search-box" class="search-box" placeholder="グループ、句法、例文、解説などで検索..."><button id="add-group-btn" class="btn">＋ 新規グループを追加</button></div>
            <details class="sub-controls"><summary>句法データ管理・ツール</summary><div class="btn-group"><button class="btn kuhou-action" data-action="import">インポート</button><button class="btn kuhou-action" data-action="export-excel">Excel出力</button><button class="btn kuhou-action" data-action="download-template">雛形DL</button><button class="btn kuhou-action" data-action="load-preset" style="background-color:#28a745">テンプレート</button><button class="btn kuhou-action" data-action="manage-tags" style="background-color:#6c5ce7">タグ管理</button><button class="btn kuhou-action" data-action="toggle-shuffle" id="kuhou-shuffle-btn" style="background-color:#7a7060">🔀 シャッフル</button></div></details>
            <div id="kuhou-tag-filter-container"></div>
            <div class="status-bar"><span>★ </span><span id="kuhou-count-display"></span></div>
            <div class="reveal-toggle-bar" id="kuhou-reveal-bar"><span class="rt-label">一括表示</span><button class="reveal-chip" data-reveal="reading">読み</button><button class="reveal-chip" data-reveal="meaning">訳</button><button class="reveal-chip" data-reveal="kakikudashi">書き下し</button><button class="reveal-chip" data-reveal="translation">日本語訳</button></div>
            <div id="kuhou-container"></div>
        </div>
        <div id="training-view" class="view"><div id="training-container"></div></div>
        <div id="goku-list-view" class="view">
             <div class="main-controls"><input type="search" id="goku-search-box" class="search-box" placeholder="語句、読み、意味、例文などで検索..."><button id="add-goku-btn" class="btn">＋ 新規語句を追加</button></div>
             <details class="sub-controls"><summary>語句データ管理・ツール</summary><div class="btn-group"><button class="btn goku-action" data-action="import">インポート</button><button class="btn goku-action" data-action="export-excel">Excel出力</button><button class="btn goku-action" data-action="download-template">雛形DL</button><button class="btn goku-action" data-action="share" style="background-color: #17a2b8;">共有リンク</button></div></details>
            <div id="goku-tag-filter-container"></div>
            <div class="status-bar"><span>★ </span><span id="goku-count-display"></span></div>
            <div id="goku-container" class="item-container" style="display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>
        </div>
    </main>
    <div id="modal-overlay" class="hidden"></div>
    <div id="modal-container" class="hidden"></div>
    <input type="file" id="import-file-input" class="hidden" accept=".xlsx, .csv">
    <script>
    // ===== ユーティリティ関数 =====
    const sanitizeHTML = (str) => { if (!str) return ''; const temp = document.createElement('div'); temp.textContent = str; return temp.innerHTML; };
    const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const matchesQuery = (raw, query) => !!raw && !!query && String(raw).toLowerCase().includes(query.toLowerCase());
    const highlightHTML = (sanitizedText, query) => { if (!query || !sanitizedText) return sanitizedText; const q = sanitizeHTML(query); if (!q) return sanitizedText; try { const re = new RegExp(escapeRegExp(q), 'gi'); return sanitizedText.replace(re, m => `<mark>${m}</mark>`); } catch(e) { return sanitizedText; } };
    XLSX.utils.book_new_append_json = (data, sheetName="Sheet1") => { const wb = XLSX.utils.book_new(); const ws = XLSX.utils.json_to_sheet(data); XLSX.utils.book_append_sheet(wb, ws, sheetName); return wb; };

    class TagFilter {
        constructor(containerId, items, onFilterChange) { this.container = document.getElementById(containerId); if (!this.container) { return; } this.container.className = 'tag-filter-system-container'; this.allItems = items; this.onFilterChange = onFilterChange; this.activeTags = []; }
        _extractAllTags() { return [...new Set(this.allItems.flatMap(item => item.tags || []))].sort((a, b) => a.localeCompare(b, 'ja')); }

                c.innerHTML = `<div class="training-card"><h2>結果</h2><div class="tr-result-score">${trainingState.correct} / ${total}</div><div class="tr-result-label">正答率 ${pct}%</div><div class="tr-result-actions"><button class="btn btn-cancel" id="tr-back-btn">設定に戻る</button><button class="btn tr-start-btn" id="tr-retry-btn" style="width:auto">もう一度</button></div></div>`;
            }
        };
        const startTraining = () => {
            const countEl = document.getElementById('tr-count'); if (countEl) trainingState.settings.count = Math.max(1, Math.min(50, Number(countEl.value) || 10));
            if (trainingState.settings.modes.length === 0) { alert('出題モードを1つ以上選択してください。'); return; }
            const qs = buildQuestions();
            if (qs.length === 0) { alert('条件に合う問題を作れません。句法データ（例文・読み・訳）が4件以上必要です。'); return; }
            trainingState.questions = qs; trainingState.idx = 0; trainingState.correct = 0; trainingState.answered = false; trainingState.screen = 'question'; trainingState.recorded = false; renderTraining();
        };
        const renderHistoryStats = () => {
            const totalQuestions = studyHistory.reduce((a,h)=>a+h.total,0);
            const totalCorrect = studyHistory.reduce((a,h)=>a+h.correct,0);
            const overallPct = totalQuestions ? Math.round(totalCorrect/totalQuestions*100) : 0;
            const dates = new Set(studyHistory.map(h=>h.date));
            let streak = 0; const d = new Date();
            while (true) { const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; if (dates.has(s)) { streak++; d.setDate(d.getDate()-1); } else break; }
            const last14 = []; const t = new Date();
            for (let i=13;i>=0;i--){ const dt=new Date(t); dt.setDate(dt.getDate()-i); const s=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; const e=studyHistory.find(h=>h.date===s); last14.push({date:s, total:e?e.total:0, correct:e?e.correct:0, label: `${dt.getMonth()+1}/${dt.getDate()}` }); }
            const maxTotal = Math.max(1, ...last14.map(d=>d.total));
            const bars = last14.map(d => { const h = d.total ? Math.max(4, (d.total/maxTotal)*60) : 2; const pct = d.total ? Math.round(d.correct/d.total*100) : 0; const color = d.total ? (pct >= 80 ? '#4caf50' : pct >= 50 ? '#f5b301' : '#e57373') : '#e0dccf'; return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0"><div style="width:100%;height:60px;display:flex;align-items:flex-end;justify-content:center"><div style="width:70%;height:${h}px;background:${color};border-radius:3px 3px 0 0" title="${d.date}: ${d.correct}/${d.total}"></div></div><div style="font-size:9px;color:var(--muted);white-space:nowrap">${d.label}</div></div>`; }).join('');
            return `<div class="training-card" style="margin-bottom:12px"><h2 style="margin-bottom:10px">学習履歴</h2><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px"><div><div style="font-size:11px;color:var(--muted)">累計問題</div><div style="font-size:20px;font-weight:700">${totalQuestions}</div></div><div><div style="font-size:11px;color:var(--muted)">累計正答率</div><div style="font-size:20px;font-weight:700">${overallPct}%</div></div><div><div style="font-size:11px;color:var(--muted)">連続学習日数</div><div style="font-size:20px;font-weight:700">${streak}日</div></div></div><div style="display:flex;gap:2px;align-items:flex-end">${bars}</div><div style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px">直近14日</div></div>`;
        };
        const hideModal = () => { modalOverlay.classList.add('hidden'); modalContainer.classList.add('hidden'); modalContainer.innerHTML = ''; currentModalSaveHandler = null; };
        const openGroupForm = (group = null) => { const isEdit = group !== null; const title = isEdit ? 'グループを編集' : '新規グループを追加'; const formHTML = `<form id="group-form-modal"><label>グループ名</label><input type="text" id="group-title" value="${isEdit ? sanitizeHTML(group.groupTitle) : ''}" required></form>`; showModal(title, formHTML, () => { const newTitle = document.getElementById('group-title').value.trim(); if (newTitle) { if (isEdit) { group.groupTitle = newTitle; } else { kuhouData.push({ groupId: Date.now(), groupTitle: newTitle, subgroups: [] }); } saveAndRender(); hideModal(); } }); };
        const openSubgroupForm = (group, subgroup = null) => {
            const isEdit = subgroup !== null; const tags = isEdit ? (subgroup.tags || []).join(', ') : ''; const title = isEdit ? '句法を編集' : '新規句法を追加';
            const createExHTML = (ex = {}, idx, existingIndex = '') => `<fieldset class="kuhou-ex-form" data-existing-example-index="${existingIndex}"><legend>例文${idx!==undefined?' '+(idx+1):''}</legend><button type="button" class="delete-ex-btn delete-btn" style="float:right;">削除</button><label>白文</label><input type="text" class="ex-hakubun" value="${sanitizeHTML(ex.hakubun||'')}"><label>書き下し文</label><input type="text" class="ex-kakikudashi" value="${sanitizeHTML(ex.kakikudashi||'')}"><label>日本語訳</label><input type="text" class="ex-translation" value="${sanitizeHTML(ex.translation||'')}"><label>出典</label><input type="text" class="ex-source" value="${sanitizeHTML(ex.source||'')}"></fieldset>`;
            const examples = (isEdit && Array.isArray(subgroup.examples)) ? subgroup.examples : [];
            const examplesHTML = examples.length ? examples.map((ex,i)=>createExHTML(ex,i,i)).join('') : createExHTML({},0);
            const formHTML = `<form id="subgroup-form-modal">
                <label>句法名</label><input type="text" id="subgroup-title" value="${isEdit ? sanitizeHTML(subgroup.subgroupTitle) : ''}" required placeholder="例: 不">
                <label>読み</label><input type="text" id="subgroup-reading" value="${isEdit ? sanitizeHTML(subgroup.reading || '') : ''}" placeholder="例: 〜せず">
                <label>訳</label><input type="text" id="subgroup-meaning" value="${isEdit ? sanitizeHTML(subgroup.meaning || '') : ''}" placeholder="例: 〜しない">
                <label>タグ(カンマ区切り)</label><input type="text" id="tags" value="${sanitizeHTML(tags)}">
                <label>解説</label><textarea id="sg-explanation">${isEdit ? sanitizeHTML(subgroup.explanation || '') : ''}</textarea>
                <label>メモ</label><textarea id="sg-memo">${isEdit ? sanitizeHTML(subgroup.memo || '') : ''}</textarea>
                <div id="kuhou-examples-container">${examplesHTML}</div>
            </form>`;
            showModal(title, formHTML, () => {
                const form = document.getElementById('subgroup-form-modal'); const newSubgroupTitle = form.querySelector('#subgroup-title').value.trim(); if(!newSubgroupTitle) { alert('句法名は必須です。'); return; }
                const newTags = form.querySelector('#tags').value.split(',').map(t => t.trim()).filter(Boolean);
                const newExamples = [...form.querySelectorAll('.kuhou-ex-form')].map(fs => { const existingIndex = fs.dataset.existingExampleIndex; const existing = existingIndex === '' ? {} : (subgroup.examples[Number(existingIndex)] || {}); return { ...existing, hakubun: fs.querySelector('.ex-hakubun').value, kakikudashi: fs.querySelector('.ex-kakikudashi').value, translation: fs.querySelector('.ex-translation').value, source: fs.querySelector('.ex-source').value }; }).filter(ex => ex.hakubun || ex.kakikudashi || ex.translation || ex.source);
                const payload = { subgroupTitle: newSubgroupTitle, reading: form.querySelector('#subgroup-reading').value.trim(), meaning: form.querySelector('#subgroup-meaning').value.trim(), tags: newTags, explanation: form.querySelector('#sg-explanation').value, memo: form.querySelector('#sg-memo').value, examples: newExamples };
                if (isEdit) { Object.assign(subgroup, payload); delete subgroup.card; }
                else { group.subgroups.push({ subgroupId: Date.now(), ...payload }); }
                saveAndRender(); hideModal();
            }, `<button type="button" id="add-kuhou-ex-btn" class="btn btn-sub-action">＋ 例文を追加</button>`);
            document.getElementById('add-kuhou-ex-btn').addEventListener('click', () => { document.getElementById('kuhou-examples-container').insertAdjacentHTML('beforeend', createExHTML({}, document.querySelectorAll('.kuhou-ex-form').length)); });
            document.getElementById('kuhou-examples-container').addEventListener('click', e => { if (e.target.classList.contains('delete-ex-btn')) { if (document.querySelectorAll('.kuhou-ex-form').length > 1) { e.target.closest('.kuhou-ex-form').remove(); } else { e.target.closest('.kuhou-ex-form').querySelectorAll('input').forEach(i => i.value = ''); } } });
        };
        const processImageFile = (file) => new Promise((resolve, reject) => { const MAX_WIDTH = 800; const reader = new FileReader(); reader.onload = (e) => { const img = new Image(); img.onload = () => { let width = img.width, height = img.height; if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/jpeg', 0.8)); }; img.onerror = reject; img.src = e.target.result; }; reader.onerror = reject; reader.readAsDataURL(file); });
        const openGokuForm = (gokuItem = null) => {
            const isEdit = gokuItem !== null; const title = isEdit ? '語句を編集' : '新規語句を追加';
            let tempPhotoData = isEdit ? gokuItem.photo || '' : '';
            const createEntryHTML = (entry = {}) => { const ex = entry.example || {}; return `<fieldset class="goku-entry-form"><legend>読み・意味セット</legend><button type="button" class="delete-entry-btn delete-btn" style="float:right;">削除</button><label>読み</label><input type="text" class="goku-reading" value="${sanitizeHTML(entry.reading || '')}"><label>品詞</label><input type="text" class="goku-pos" value="${sanitizeHTML(entry.partOfSpeech || '')}"><label>意味(改行で複数)</label><textarea class="goku-meanings">${sanitizeHTML((entry.meanings || []).join('\n'))}</textarea><fieldset><legend>例文</legend><label>白文</label><input type="text" class="ex-hakubun" value="${sanitizeHTML(ex.hakubun||'')}"><label>書き下し文</label><input type="text" class="ex-kakikudashi" value="${sanitizeHTML(ex.kakikudashi||'')}"><label>現代語訳</label><input type="text" class="ex-translation" value="${sanitizeHTML(ex.translation||'')}"></fieldset></fieldset>`; };
            const entries = (isEdit && Array.isArray(gokuItem.entries) && gokuItem.entries.length > 0) ? gokuItem.entries : [{}];
            const formHTML = `<form id="goku-form-modal"><label>語句（代表表記）</label><input type="text" id="goku-title" value="${isEdit ? sanitizeHTML(gokuItem.title) : ''}" required><label>異体字・類義字(カンマ区切り)</label><input type="text" id="goku-variants" value="${isEdit ? sanitizeHTML((gokuItem.variants || []).join(', ')) : ''}"><div id="goku-entries-container">${entries.map(createEntryHTML).join('')}</div><label>共通メモ</label><textarea id="goku-common-memo">${isEdit ? sanitizeHTML(gokuItem.commonMemo || '') : ''}</textarea><label>タグ(カンマ区切り)</label><input type="text" id="tags" value="${isEdit ? sanitizeHTML((gokuItem.tags || []).join(', ')) : ''}"><fieldset><legend>写真</legend><label for="goku-photo-file">ファイルから選択</label><input type="file" id="goku-photo-file" accept="image/*"><img id="photo-preview" class="${tempPhotoData ? '' : 'hidden'}" src="${tempPhotoData}"><label for="goku-photo-url">または URLを入力</label><input type="text" id="goku-photo-url" value="${tempPhotoData.startsWith('data:') ? '' : sanitizeHTML(tempPhotoData)}" placeholder="https://..."></fieldset></form>`;
            showModal(title, formHTML, () => {
                const form = document.getElementById('goku-form-modal'); const newTitle = form.querySelector('#goku-title').value.trim();
                if (newTitle) {
                    const finalPhotoData = form.querySelector('#goku-photo-url').value.trim() || tempPhotoData;
                    const newVariants = form.querySelector('#goku-variants').value.split(',').map(t => t.trim()).filter(Boolean);
                    const newEntries = [...form.querySelectorAll('.goku-entry-form')].map(fieldset => ({ reading: fieldset.querySelector('.goku-reading').value, partOfSpeech: fieldset.querySelector('.goku-pos').value, meanings: fieldset.querySelector('.goku-meanings').value.trim().split('\n').filter(Boolean), example: { hakubun: fieldset.querySelector('.ex-hakubun').value, kakikudashi: fieldset.querySelector('.ex-kakikudashi').value, translation: fieldset.querySelector('.ex-translation').value } }));
                    if(newEntries.length === 0 || (newEntries.length === 1 && !newEntries[0].reading && newEntries[0].meanings.length === 0) ) { alert('「読み・意味セット」を最低一つは入力してください。'); return; }
                    const newTags = form.querySelector('#tags').value.split(',').map(t => t.trim()).filter(Boolean); 
                    const newCommonMemo = form.querySelector('#goku-common-memo').value;
                    if (isEdit) { Object.assign(gokuItem, {title: newTitle, variants: newVariants, entries: newEntries, tags: newTags, commonMemo: newCommonMemo, photo: finalPhotoData }); } 
                    else { gokuData.push({ id: Date.now(), title: newTitle, variants: newVariants, entries: newEntries, tags: newTags, commonMemo: newCommonMemo, photo: finalPhotoData }); }
                    saveAndRender(); hideModal();
                }
            }, `<div class="left-action"><button type="button" id="add-entry-btn" class="btn btn-sub-action">＋ 読み・意味セットを追加</button></div>`);
            document.getElementById('add-entry-btn').addEventListener('click', () => { document.getElementById('goku-entries-container').insertAdjacentHTML('beforeend', createEntryHTML()); });
            document.getElementById('goku-entries-container').addEventListener('click', e => { if(e.target.classList.contains('delete-entry-btn')) { if (document.querySelectorAll('.goku-entry-form').length > 1) { e.target.closest('.goku-entry-form').remove(); } else { alert('最後のセットは削除できません。'); } } });
            document.getElementById('goku-photo-file').addEventListener('change', async (e) => { const file = e.target.files[0]; if (file) { try { const resizedDataUrl = await processImageFile(file); tempPhotoData = resizedDataUrl; document.getElementById('photo-preview').src = resizedDataUrl; document.getElementById('photo-preview').classList.remove('hidden'); document.getElementById('goku-photo-url').value = ''; } catch (err) { alert('画像の処理に失敗しました。'); } } });
        };
        
        document.addEventListener('click', (e) => {
            const { target } = e;
            if (target.closest('.modal-actions')) { if (target.id === 'modal-save-btn' && currentModalSaveHandler) { currentModalSaveHandler(); } if (target.id === 'modal-cancel-btn') { hideModal(); } return; }
            if (target.id === 'modal-overlay') { hideModal(); return; }
            if (target.classList.contains('goku-link')) { const container = target.closest('.ex-value'); if (container && container.classList.contains('hidden-blur')) return; e.stopPropagation(); showGokuPopup(target.dataset.gokuId); return; }
            if (target.classList.contains('sg-check-btn')) { e.preventDefault(); e.stopPropagation(); const sgEl = target.closest('.subgroup'); const groupEl = target.closest('.kuhou-group'); const grp = kuhouData.find(g => g.groupId === Number(groupEl.dataset.groupId)); const sg = grp && grp.subgroups.find(s => s.subgroupId === Number(sgEl.dataset.subgroupId)); if (sg) { sg.checked = !sg.checked; saveData(); target.classList.toggle('checked'); target.textContent = sg.checked ? '★' : '☆'; } return; }
            if (target.classList.contains('ex-check-btn')) { e.preventDefault(); e.stopPropagation(); const exEl = target.closest('.kuhou-example'); const sgEl = target.closest('.subgroup'); const groupEl = target.closest('.kuhou-group'); const grp = kuhouData.find(g => g.groupId === Number(groupEl.dataset.groupId)); const sg = grp && grp.subgroups.find(s => s.subgroupId === Number(sgEl.dataset.subgroupId)); const ex = sg && sg.examples[Number(exEl.dataset.exampleIdx)]; if (ex) { ex.checked = !ex.checked; saveData(); target.classList.toggle('checked'); target.textContent = ex.checked ? '★' : '☆'; } return; }
            if (target.classList.contains('summary-value')) { e.preventDefault(); e.stopPropagation(); target.classList.toggle('hidden-blur'); return; }
            { const exv = target.closest('.ex-value'); if (exv && exv.dataset.field) { exv.classList.toggle('hidden-blur'); return; } }
            if (target.classList.contains('reveal-chip')) { const f = target.dataset.reveal; if (activeReveal[f]) { activeReveal[f] = false; } else { activeReveal[f] = true; } applyRevealState(); return; }
            if (target.closest('.subgroup > details > summary') && !target.closest('.actions')) { return; }
            const kuhouAction = target.closest('.kuhou-action'); if (kuhouAction) { const action = kuhouAction.dataset.action; if (action === 'import') { currentImportHandler = handleKuhouImport; importFileInput.click(); } else if (action === 'export-excel') exportData('kuhou'); else if (action === 'download-template') downloadTemplate('kuhou'); else if (action === 'load-preset') openPresetLoader(); else if (action === 'manage-tags') openTagManager(); else if (action === 'toggle-shuffle') { kuhouShuffleMode = !kuhouShuffleMode; if (!kuhouShuffleMode) kuhouShuffleOrder.clear(); else kuhouShuffleOrder.clear(); document.getElementById('kuhou-shuffle-btn').style.backgroundColor = kuhouShuffleMode ? '#f5b301' : '#555'; document.getElementById('kuhou-shuffle-btn').textContent = kuhouShuffleMode ? '🔀 シャッフル中' : '🔀 シャッフル'; render(); } return; }
            const gokuAction = target.closest('.goku-action'); if (gokuAction) { const action = gokuAction.dataset.action; if (action === 'import') { currentImportHandler = handleGokuImport; importFileInput.click(); } else if (action === 'export-excel') exportData('goku'); else if (action === 'download-template') downloadTemplate('goku'); else if (action === 'share') createShareLink(); return; }
            if (target.id === 'add-group-btn') { openGroupForm(); return; }
            if (target.id === 'add-goku-btn') { openGokuForm(); return; }
            const groupEl = target.closest('.kuhou-group');
            if(groupEl){
                const groupId = Number(groupEl.dataset.groupId); const group = kuhouData.find(g => g.groupId === groupId); if (!group) return;
                const subgroupEl = target.closest('.subgroup');
                if (subgroupEl) {
                    const subgroupId = Number(subgroupEl.dataset.subgroupId); const subgroup = group.subgroups.find(sg => sg.subgroupId === subgroupId); if (!subgroup) return;
                    if (target.classList.contains('toggle-all-btn')) { e.preventDefault(); const sgEl = target.closest('.subgroup'); sgEl.classList.toggle('sg-reveal-all'); target.textContent = sgEl.classList.contains('sg-reveal-all') ? '全非表示' : '全表示'; return; }
                    if (target.classList.contains('edit-subgroup-btn')) { e.preventDefault(); openSubgroupForm(group, subgroup); }
                    else if (target.classList.contains('delete-subgroup-btn')) { e.preventDefault(); if (confirm(`句法「${sanitizeHTML(subgroup.subgroupTitle)}」を削除しますか？`)) { group.subgroups = group.subgroups.filter(sg => sg.subgroupId !== subgroupId); saveAndRender(); } }
                } else {
                    if (target.classList.contains('add-subgroup-btn')) { e.preventDefault(); openSubgroupForm(group); }
                    else if (target.classList.contains('edit-group-btn')) { e.preventDefault(); openGroupForm(group); }
                    else if (target.classList.contains('delete-group-btn')) { e.preventDefault(); if (confirm(`グループ「${sanitizeHTML(group.groupTitle)}」を削除しますか？`)) { kuhouData = kuhouData.filter(g => g.groupId !== groupId); saveAndRender(); } }
                    else if (target.classList.contains('reorder-group-up-btn')) { e.preventDefault(); const i = kuhouData.indexOf(group); if (i > 0) { [kuhouData[i], kuhouData[i-1]] = [kuhouData[i-1], kuhouData[i]]; saveAndRender(); } }
                    else if (target.classList.contains('reorder-group-down-btn')) { e.preventDefault(); const i = kuhouData.indexOf(group); if (i < kuhouData.length - 1) { [kuhouData[i], kuhouData[i+1]] = [kuhouData[i+1], kuhouData[i]]; saveAndRender(); } }
                }
                return;
            }
            const gokuCardEl = target.closest('.goku-card');
            if (gokuCardEl) {
                const gokuId = Number(gokuCardEl.dataset.gokuId); const gokuItem = gokuData.find(g => g.id === gokuId); if (!gokuItem) return;
                if (target.classList.contains('edit-goku-btn')) { openGokuForm(gokuItem); }
                else if (target.classList.contains('delete-goku-btn')) { if (confirm(`語句「${sanitizeHTML(gokuItem.title)}」を削除しますか？`)) { gokuData = gokuData.filter(g => g.id !== gokuId); saveAndRender(); } }
                return;
            }
            if (target.id === 'tr-checked-only-chip') { trainingState.settings.checkedOnly = !trainingState.settings.checkedOnly; renderTraining(); return; }
            if (target.classList.contains('tr-sg-check')) { const q = trainingState.questions[trainingState.idx]; q.subgroup.checked = !q.subgroup.checked; saveData(); renderTraining(); return; }
            if (target.classList.contains('tr-ex-check')) { const q = trainingState.questions[trainingState.idx]; const ex = q.subgroup.examples[q.exIdx]; if (ex) { ex.checked = !ex.checked; saveData(); renderTraining(); } return; }
            if (target.classList.contains('tr-mode-chip')) { const m = target.dataset.mode; const arr = trainingState.settings.modes; const i = arr.indexOf(m); if (i>-1) arr.splice(i,1); else arr.push(m); renderTraining(); return; }
            if (target.classList.contains('tr-tag-chip')) { const t = target.dataset.tag; const arr = trainingState.settings.tags; const i = arr.indexOf(t); if (i>-1) arr.splice(i,1); else arr.push(t); renderTraining(); return; }
            if (target.id === 'tr-start-btn' || target.id === 'tr-retry-btn') { startTraining(); return; }
            if (target.id === 'tr-back-btn') { trainingState.screen = 'start'; renderTraining(); return; }
            if (target.classList.contains('tr-choice') && !trainingState.answered) { const q = trainingState.questions[trainingState.idx]; const pick = target.dataset.choice; trainingState.lastPick = pick; trainingState.lastCorrect = pick === q.answer; if (trainingState.lastCorrect) trainingState.correct++; trainingState.answered = true; renderTraining(); return; }
            if (target.id === 'tr-next-btn') { trainingState.answered = false; trainingState.idx++; if (trainingState.idx >= trainingState.questions.length) trainingState.screen = 'result'; renderTraining(); return; }
            if (target.classList.contains('toggle-visibility')) { const fieldEl = target.closest('.field'); if (fieldEl) { const contentEl = fieldEl.querySelector('.content'); if (contentEl) contentEl.classList.toggle('hidden'); } }
            if (target.classList.contains('toggle-summary')) { e.preventDefault(); e.stopPropagation(); const wrap = target.closest('.summary-field'); const val = wrap && wrap.querySelector('.summary-value'); if (val) val.classList.toggle('hidden-blur'); }
        });
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.tab)));
        kuhouSearchBox.addEventListener('input', (e) => { kuhouSearchQuery = e.target.value; render(); });
        gokuSearchBox.addEventListener('input', (e) => { gokuSearchQuery = e.target.value; render(); });
        importFileInput.addEventListener('change', handleFileImport);
        loadData(); loadFromURL(); switchView(activeTab);
    });
    </script>
